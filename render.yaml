services:
  - type: web
    name: bombman-server
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 3001
    healthCheckPath: /health
