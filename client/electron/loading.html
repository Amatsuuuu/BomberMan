<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;color:#eee;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
.logo{font-size:42px;font-weight:800;letter-spacing:3px;margin-bottom:8px}
.logo span{color:#3c78e6}
.sub{opacity:.6;font-size:14px;margin-bottom:32px}
.spinner{width:40px;height:40px;border:3px solid #2a2a4a;border-top-color:#3c78e6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bomber{font-size:48px;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style></head><body>
<div class="bomber">💣</div>
<div class="logo">BOMB<span>MAN</span></div>
<div class="sub">Loading...</div>
<div class="spinner"></div>
</body></html>
