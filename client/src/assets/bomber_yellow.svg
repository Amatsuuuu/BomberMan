<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- shadow -->
  <ellipse cx="32" cy="56" rx="14" ry="4" fill="#000000" opacity="0.2"/>

  <!-- feet -->
  <rect x="20" y="46" width="8" height="8" rx="2" fill="#2b2b2b"/>
  <rect x="36" y="46" width="8" height="8" rx="2" fill="#2b2b2b"/>

  <!-- body (round bomber shape) -->
  <ellipse cx="32" cy="34" rx="18" ry="16" fill="#f4d03f"/>
  <ellipse cx="32" cy="34" rx="18" ry="16" fill="none" stroke="#2b2b2b" stroke-width="2"/>

  <!-- belly highlight -->
  <ellipse cx="32" cy="38" rx="10" ry="8" fill="#ffffff" opacity="0.25"/>

  <!-- arms -->
  <circle cx="14" cy="34" r="6" fill="#f4d03f" stroke="#2b2b2b" stroke-width="2"/>
  <circle cx="50" cy="34" r="6" fill="#f4d03f" stroke="#2b2b2b" stroke-width="2"/>

  <!-- helmet/head -->
  <circle cx="32" cy="16" r="13" fill="#f4d03f" stroke="#2b2b2b" stroke-width="2"/>

  <!-- helmet antenna -->
  <line x1="32" y1="4" x2="32" y2="-2" stroke="#2b2b2b" stroke-width="2"/>
  <circle cx="32" cy="-3" r="2.5" fill="#ffd700" stroke="#2b2b2b" stroke-width="1"/>

  <!-- visor -->
  <rect x="20" y="12" width="24" height="9" rx="4" fill="#1c1c1c"/>
  <rect x="22" y="13.5" width="9" height="6" rx="2" fill="#ffffff" opacity="0.85"/>
</svg>
